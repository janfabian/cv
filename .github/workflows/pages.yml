name: Build PDF and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with PDF
        run: |
          mkdir -p _site
          cp index.html robots.txt _site/
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --no-pdf-header-footer \
            --print-to-pdf="$PWD/_site/index.pdf" \
            "file://$PWD/index.html"
          test -s _site/index.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
